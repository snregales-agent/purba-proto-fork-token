# Arm B: move the fork's commits INSIDE the base repo verbatim, and let the
# ordinary inside-repo gate handle the mirror branch. No rewrite happens here.
#
# The one thing this measures: does a pull request opened with GITHUB_TOKEN
# start any workflow run? If it does not, `sign.yml` never fires on the mirror
# and the required context never appears.
name: ArmB
on:
  pull_request_target:
    types: [labeled]

jobs:
  mirror:
    if: github.event.label.name == 'armB'
    name: armB-mirror
    permissions:
      contents: write
      pull-requests: write
      checks: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: B1 fetch the fork commits through the base repo
        run: |
          set +e
          git fetch origin "refs/pull/$PR/head:pr-head" 2>&1 | tail -2
          echo "B1 fetch_exit=$?"
          git log --format='B1 commit %h author=%an <%ae> committer=%cn' origin/main..pr-head

      - name: B2 push the fork commits verbatim to a branch in the base repo
        run: |
          set +e
          git push origin "pr-head:refs/heads/accepted/pr-$PR" --force 2>&1 | tail -3
          echo "B2 push_exit=$?"

      - name: B3 open the mirror pull request with GITHUB_TOKEN
        run: |
          set +e
          url=$(gh pr create --base main --head "accepted/pr-$PR" \
            --title "chore: accept #$PR from a fork" \
            --body "Mirror of #$PR. The commits are the contributor's, unchanged." 2>&1)
          echo "B3 create_exit=$?"
          echo "B3 url=$url"
          num=$(basename "$url")
          echo "B3 mirror_pr=$num"
          echo "B3 sleeping 25s, then listing the runs that event started"
          sleep 25
          gh api "repos/$GH_REPO/actions/runs?per_page=10" \
            --jq '.workflow_runs[] | "B3 run \(.name) ev=\(.event) head=\(.head_branch) status=\(.status)"'
