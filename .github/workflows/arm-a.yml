# Arm A: can a base-repo token post the REQUIRED check on a fork PR's head SHA?
name: ArmA
on:
  pull_request_target:
    types: [opened, reopened, synchronize]

jobs:
  probe:
    name: armA-probe
    permissions:
      checks: write
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
      ASSOC: ${{ github.event.pull_request.author_association }}
    steps:
      - name: what am I
        run: |
          echo "A1 head_repo=$HEAD_REPO base=$GH_REPO"
          echo "A2 head_sha=$HEAD_SHA author_association=$ASSOC"
          echo "A3 is_fork=${{ github.event.pull_request.head.repo.full_name != github.repository }}"

      - name: A4 can I read the fork commit from the base repo
        run: |
          set +e
          gh api "repos/$GH_REPO/commits/$HEAD_SHA" --jq '.sha' ; echo "A4 exit=$?"

      - name: A5 post the required context on the fork head sha
        run: |
          set +e
          out=$(gh api --method POST "repos/$GH_REPO/check-runs" \
            -f name="Sign-off" \
            -f head_sha="$HEAD_SHA" \
            -f status=completed \
            -f conclusion=success \
            -f "output[title]=arm A" \
            -f "output[summary]=posted from pull_request_target against a fork head sha" 2>&1)
          code=$?
          echo "A5 exit=$code"
          echo "$out" | head -20

      - name: A6 can this token write contents in the BASE repo
        run: |
          set +e
          out=$(gh api --method POST "repos/$GH_REPO/git/refs" \
            -f ref="refs/heads/arm-a-write-probe-$HEAD_SHA" -f sha="$(gh api repos/$GH_REPO/commits/main --jq .sha)" 2>&1)
          echo "A6 exit=$?"
          echo "$out" | head -10
